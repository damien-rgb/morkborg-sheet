<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MÖRK BORG Sheet</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="stylesheet" href="sheet.css">
</head>
<body>

<!-- Rules reminders live in title attributes, not on the page. Anyone who wants
     one hovers for it. Players who already know the game are not made to scroll
     past it every session. -->

<header class="bar">
  <div class="bar-buttons">
    <button type="button" id="btn-new" title="Roll a brand new character">New scvm</button>
    <button type="button" id="btn-export" title="Save this character to a file">Save</button>
    <button type="button" id="btn-import" title="Load a character from a file">Load</button>
    <button type="button" id="btn-print" title="Print a clean paper sheet">Print</button>
    <button type="button" id="btn-better"
      title="1. More hit points: roll 6d10. Equal to your maximum or higher, add a d6 to the maximum.&#10;2. Every ability: roll a d6 against each. Equal or higher, up by 1. Lower, down by 1. Never above +6 or below -3. Anything from -3 to +1 always goes up, unless the d6 shows a 1.&#10;3. In the debris: roll a d6. 1 to 3 nothing, 4 is 3d10 silver, 5 an unclean scroll, 6 a sacred scroll.">Level up</button>
  </div>
</header>

<main id="sheet">

  <section class="block">
    <div class="pair">
      <div>
        <label class="lbl" for="f-name">Name</label>
        <input class="big-text" id="f-name" type="text" autocomplete="off">
      </div>
      <div>
        <label class="lbl" for="f-class">Class</label>
        <input class="big-text" id="f-class" type="text" autocomplete="off">
      </div>
    </div>
    <p class="note" id="class-desc"></p>
  </section>

  <section class="block">
    <h2 title="Test an ability: roll a d20 and add the number. DR12 unless the GM says otherwise.">Abilities</h2>
    <div id="abilities" class="abilities"></div>
    <p class="note" id="class-note"></p>
  </section>

  <section class="block">
    <div class="hp-row">
      <span class="lbl" title="At 0 or less you are broken.">HP</span>
      <button type="button" class="step" data-step="hp:-1" aria-label="Lose one hit point">&minus;</button>
      <input id="f-hp" type="number" inputmode="numeric" title="Current hit points">
      <span class="of">/</span>
      <input id="f-hpmax" type="number" inputmode="numeric" title="Maximum hit points">
      <button type="button" class="step" data-step="hp:1" aria-label="Gain one hit point">+</button>
    </div>

    <div class="three">
      <div>
        <span class="lbl" title="Spend one to reroll any die.">Omens</span>
        <div class="counter">
          <button type="button" class="step" data-step="omens:-1" aria-label="Spend an omen">&minus;</button>
          <input id="f-omens" type="number" inputmode="numeric">
          <button type="button" class="step" data-step="omens:1" aria-label="Gain an omen">+</button>
        </div>
      </div>
      <div>
        <span class="lbl" title="Uses of Powers left today. Each morning roll d4 and add Presence.">Powers</span>
        <div class="counter">
          <button type="button" class="step" data-step="powers:-1" aria-label="Use a power">&minus;</button>
          <input id="f-powers" type="number" inputmode="numeric">
          <button type="button" class="step" data-step="powers:1" aria-label="Regain a power">+</button>
        </div>
      </div>
      <div>
        <span class="lbl">Silver</span>
        <!-- No steps here. Silver moves in tens and hundreds, never in ones,
             so the buttons were decoration. -->
        <div class="counter">
          <input id="f-silver" type="number" inputmode="numeric" aria-label="Silver">
        </div>
      </div>
    </div>
  </section>

  <section class="block">
    <h2 title="Defend: roll a d20 and add Agility, DR12. If you are hit, roll the armour die and take that much off the damage.">Armour</h2>
    <div class="armour-row">
      <input class="big-text" id="f-armour" type="text" autocomplete="off"
        placeholder="No armour" aria-label="Armour worn" title="What you are wearing">
      <input class="big-text" id="f-armour-dr" type="text" autocomplete="off"
        placeholder="none" aria-label="Damage it stops" title="Damage it stops, for example -d2">
      <label class="check" title="Shields stop 1 more damage, or break to ignore one attack">
        <input type="checkbox" id="f-shield"> Shield</label>
    </div>
  </section>

  <section class="block">
    <h2>Your class</h2>
    <div id="features" class="list"></div>
    <button type="button" class="add" data-add="features">Add</button>
  </section>

  <section class="block">
    <h2 title="Attack: roll a d20, add Strength up close or Presence at range, DR12. Then roll the damage die.">Weapons</h2>
    <div id="weapons" class="list"></div>
    <button type="button" class="add" data-add="weapons">Add</button>
  </section>

  <section class="block">
    <h2>Equipment</h2>
    <div id="gear" class="list"></div>
    <button type="button" class="add" data-add="gear">Add</button>
  </section>

  <section class="block">
    <h2 title="Reading a scroll: test Presence DR12. Fail and you lose d2 HP and are dizzy for an hour.">Scrolls</h2>
    <div id="scrolls" class="list"></div>
    <button type="button" class="add" data-add="scrolls">Add</button>
  </section>

  <section class="block">
    <h2>Notes</h2>
    <textarea id="f-notes" rows="3"></textarea>
  </section>

  <p class="footer"><span id="saved-at"></span></p>

</main>

<dialog id="confirm-new">
  <form method="dialog">
    <h2>Leave this one for the crows?</h2>
    <p>The scvm on screen will be gone and the dirt will not give them back.
      Save them to a file first if you are sentimental.</p>
    <menu>
      <button value="cancel">No. They draw breath yet</button>
      <button value="ok" class="danger">Yes. Roll a new wretch</button>
    </menu>
  </form>
</dialog>

<input type="file" id="file-input" accept="application/json,.json" hidden>

<script src="data.js"></script>
<script src="classes.js"></script>
<script src="sheet.js"></script>
</body>
</html>
